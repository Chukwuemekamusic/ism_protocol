specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum/contract
    name: MarketRegistry
    network: base-sepolia
    source:
      address: "0xB7fC139046a2d976060e2dB969b6Dd63ACeEA3f4"
      abi: MarketRegistry
      startBlock: 18500000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - Token
        - Protocol
      abis:
        - name: MarketRegistry
          file: MarketRegistry/MarketRegistry.json
        - name: LendingPool
          file: MarketRegistry/LendingPool.json
        - name: ERC20
          file: MarketRegistry/ERC20.json
      eventHandlers:
        - event: MarketRegistered(indexed address,indexed address,indexed address)
          handler: handleMarketRegistered
      file: MarketRegistry/MarketRegistry.wasm
  - kind: ethereum/contract
    name: MarketFactory
    network: base-sepolia
    source:
      address: "0x403276c627737cAb896BbdDEfEd4538d9a6aE5C0"
      abi: MarketFactory
      startBlock: 18500000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - Token
      abis:
        - name: MarketFactory
          file: MarketFactory/MarketFactory.json
        - name: LendingPool
          file: MarketFactory/LendingPool.json
        - name: ERC20
          file: MarketFactory/ERC20.json
      eventHandlers:
        - event: MarketCreated(indexed address,indexed address,indexed address,address)
          handler: handleMarketCreated
      file: MarketFactory/MarketFactory.wasm
  - kind: ethereum/contract
    name: DutchAuctionLiquidator
    network: base-sepolia
    source:
      address: "0x7514D0B0883cfCb2f7Cc5AeB512D9c5ab91160E2"
      abi: DutchAuctionLiquidator
      startBlock: 18500000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Auction
        - Liquidation
        - Position
        - User
      abis:
        - name: DutchAuctionLiquidator
          file: DutchAuctionLiquidator/DutchAuctionLiquidator.json
        - name: LendingPool
          file: DutchAuctionLiquidator/LendingPool.json
        - name: OracleRouter
          file: DutchAuctionLiquidator/OracleRouter.json
      eventHandlers:
        - event: AuctionStarted(indexed uint256,indexed address,indexed
            address,uint256,uint256,uint256,uint256)
          handler: handleAuctionStarted
        - event: AuctionExecuted(indexed uint256,indexed address,uint256,uint256,uint256)
          handler: handleAuctionExecuted
        - event: AuctionCancelled(indexed uint256,string)
          handler: handleAuctionCancelled
      file: DutchAuctionLiquidator/DutchAuctionLiquidator.wasm
templates:
  - kind: ethereum/contract
    name: LendingPool
    network: base-sepolia
    source:
      abi: LendingPool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - Position
        - User
        - Transaction
        - MarketSnapshot
      abis:
        - name: LendingPool
          file: LendingPool/LendingPool.json
        - name: OracleRouter
          file: LendingPool/OracleRouter.json
        - name: ERC20
          file: LendingPool/ERC20.json
      eventHandlers:
        - event: Deposit(indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: Borrow(indexed address,uint256,uint256)
          handler: handleBorrow
        - event: Repay(indexed address,indexed address,uint256,uint256)
          handler: handleRepay
        - event: DepositCollateral(indexed address,uint256)
          handler: handleDepositCollateral
        - event: WithdrawCollateral(indexed address,uint256)
          handler: handleWithdrawCollateral
        - event: InterestAccrued(uint256,uint256,uint256)
          handler: handleInterestAccrued
      file: templates/LendingPool/LendingPool.wasm
